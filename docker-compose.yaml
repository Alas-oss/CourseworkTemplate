name: ai-archive
# To be complete
services:

  api:
    build: ./api
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./database:/data
      - ./firebase_credentials.json:/app/firebase_credentials.json:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  semantic-worker:
    build: ./semantic_worker
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy

  llm-worker:
    build: ./llm_worker
    env_file: .env
    restart: unless-stopped
    volumes:
      - ./descriptions/knowledge:/knowledge:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      ollama:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3.13-management
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "2"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 15s

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy


  tests:
    build: ./tests
    profiles:
      - test
    environment:
      BASE_URL: "http://api:8000"
    depends_on:
      api:
        condition: service_healthy
      llm-worker:
        condition: service_started

volumes:
  ollama-data: