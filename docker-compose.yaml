name: ai-archive
# To be complete
services:

  api:
    build: ./api
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./database:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  semantic-worker:
    build: ./semantic_worker
    env_file: .env
    depends_on:
      rabbitmq:
        condition: service_healthy

  llm-worker:
    build: ./llm_worker
    env_file: .env

  rabbitmq:
    image: rabbitmq:3.13-management
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy


  tests:
    build: ./tests
    profiles:
      - test
    environment:
      BASE_URL: "http://api:8000"
    depends_on:
      api:
        condition: service_healthy
      llm-worker:
        condition: service_started
