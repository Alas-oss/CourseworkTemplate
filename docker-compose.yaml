name: ai-archive
# To be complete
services:

  api:
    build: ./api
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./database:/data
      - ./firebase_credentials.json:/app/firebase_credentials.json:ro
    security_opt:
      - no-new-privileges:true
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  semantic-worker:
    build: ./semantic_worker
    env_file: .env
    security_opt:
      - no-new-privileges:true
    depends_on:
      rabbitmq:
        condition: service_healthy

  llm-worker:
    build: ./llm_worker
    env_file: .env
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./descriptions/knowledge:/knowledge:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      ollama:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3.13-management
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "2"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 15s

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-archive-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    security_opt:
      - no-new-privileges:true
    depends_on:
      - prometheus

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy


  tests:
    build: ./tests
    profiles:
      - test
    environment:
      BASE_URL: "http://api:8000"
      PROMETHEUS_URL: "http://prometheus:9090"
    volumes:
      - ./frontend/firebase-config.js:/config/firebase-config.js:ro
    depends_on:
      api:
        condition: service_healthy
      llm-worker:
        condition: service_started
      prometheus:
        condition: service_started

volumes:
  ollama-data:
  prometheus-data:
  grafana-data:
